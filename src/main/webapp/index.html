<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E63A8">
  <meta name="description" content="Laundry HUB: walk-in or pickup & delivery laundry. Wash, dry, fold.">
  <title>Laundry HUB</title>

  <!-- Installable app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LaundryHUB">

  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">

  <!-- Public keys, generated at build time from config.properties. -->
  <script src="config.js"></script>

  <!-- Shell only: load Google Maps with the key from LH_CONFIG. All map logic is Java. -->
  <script>
    (function () {
      var key = window.LH_CONFIG && window.LH_CONFIG.GOOGLE_MAPS_KEY;
      window.lhMapsReady = function () { window.LH_MAPS_READY = true; };
      // Google calls this when the key is wrong or this address is not allowed for the key.
      window.gm_authFailure = function () { window.LH_MAPS_AUTH_FAILED = true; };
      if (!key) return;
      var s = document.createElement("script");
      s.async = true;
      s.onerror = function () { window.LH_MAPS_AUTH_FAILED = true; };
      s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key)
        + "&loading=async&libraries=marker,geocoding&callback=lhMapsReady";
      document.head.appendChild(s);
    })();
  </script>

  <script src="js/app.js"></script>
</head>
<body onload="main()">
  <div id="app"></div>
  <noscript>Laundry HUB needs JavaScript to run.</noscript>
</body>
</html>
