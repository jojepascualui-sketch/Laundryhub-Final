<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laundry HUB sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E63A8}a:hover{color:#123F6E}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F5F2; color: #14212B; font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden; box-sizing: border-box">
<div style="background: {{accent}}; color: #fff; padding: 46px 26px 34px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden">
<svg width="220" height="220" viewBox="0 0 160 160" style="position: absolute; right: -60px; top: -50px; opacity: 0.16" aria-hidden="true"><circle cx="80" cy="80" r="70" fill="none" stroke="#fff" stroke-width="14"></circle><circle cx="80" cy="80" r="34" fill="none" stroke="#fff" stroke-width="8"></circle></svg>
<span style="width: 52px; height: 52px; border-radius: 16px; background: #fff; display: flex; align-items: center; justify-content: center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="3"></rect><circle cx="12" cy="13" r="5"></circle><path d="M8 6h.01M11 6h2"></path></svg>
</span>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.8px; line-height: 1.05">{{heading}}</div>
<div style="font-size: 15px; opacity: 0.92">{{subheading}}</div>
</div>

<div style="flex: 1; overflow-y: auto; padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 16px">

<sc-if value="{{isLogin}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #E3E8E4; border-radius: 16px; padding: 5px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="2">
<button onClick="{{r.pick}}" style="min-height: 44px; border-radius: 12px; border: none; background: {{r.bg}}; color: {{r.color}}; font-weight: 700; font-size: 14px">{{r.label}}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isSignup}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="fullname" style="font-size: 13px; font-weight: 700">Full name</label>
<input id="fullname" placeholder="Juan Dela Cruz" style="min-height: 50px; border-radius: 14px; border: 1.5px solid #C8D0CA; padding: 0 14px; font-size: 15px; background: #fff; color: #14212B">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="mobile" style="font-size: 13px; font-weight: 700">Mobile number</label>
<input id="mobile" inputmode="numeric" placeholder="09XX XXX XXXX" style="min-height: 50px; border-radius: 14px; border: 1.5px solid #C8D0CA; padding: 0 14px; font-size: 15px; background: #fff; color: #14212B">
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 13px; font-weight: 700">{{emailLabel}}</label>
<input id="email" type="email" placeholder="{{emailPh}}" style="min-height: 50px; border-radius: 14px; border: 1.5px solid #C8D0CA; padding: 0 14px; font-size: 15px; background: #fff; color: #14212B">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pw" style="font-size: 13px; font-weight: 700">Password</label>
<input id="pw" type="password" placeholder="At least 8 characters" style="min-height: 50px; border-radius: 14px; border: 1.5px solid #C8D0CA; padding: 0 14px; font-size: 15px; background: #fff; color: #14212B">
</div>

<sc-if value="{{isSignup}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pw2" style="font-size: 13px; font-weight: 700">Confirm password</label>
<input id="pw2" type="password" placeholder="Re-enter password" style="min-height: 50px; border-radius: 14px; border: 1.5px solid #C8D0CA; padding: 0 14px; font-size: 15px; background: #fff; color: #14212B">
</div>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #4A5863; line-height: 1.4"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; flex-shrink: 0">I agree to the Terms of Service and Privacy Policy, including use of my location for pickup and delivery.</label>
</sc-if>

<sc-if value="{{isLogin}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px">
<label style="display: flex; gap: 8px; align-items: center; color: #4A5863"><input type="checkbox" style="width: 18px; height: 18px; margin: 0">Remember me</label>
<a href="#" style="font-weight: 700; text-decoration: none">Forgot password?</a>
</div>
</sc-if>

<a href="{{primaryHref}}" style="min-height: 54px; border-radius: 27px; background: {{accent}}; color: #fff; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">{{primaryLabel}}</a>

<sc-if value="{{showGoogle}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 12px; color: #4A5863; font-size: 13px"><span style="flex: 1; height: 1px; background: #D5DBD6"></span>or<span style="flex: 1; height: 1px; background: #D5DBD6"></span></div>
<button style="min-height: 52px; border-radius: 26px; border: 1.5px solid #C8D0CA; background: #fff; color: #14212B; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5.1a4.4 4.4 0 0 1-1.9 2.9v2.4h3.1c1.8-1.7 2.7-4.1 2.7-7z"></path><path d="M12 21.5c2.6 0 4.7-.9 6.3-2.3l-3.1-2.4c-.9.6-2 .9-3.2.9a5.6 5.6 0 0 1-5.3-3.9H3.5v2.5A9.5 9.5 0 0 0 12 21.5z"></path></svg>
Continue with Google</button>
</sc-if>

<div style="text-align: center; font-size: 14px; color: #4A5863">{{switchText}} <button onClick="{{toggleMode}}" style="border: none; background: none; color: {{accent}}; font-weight: 700; font-size: 14px; padding: 8px 4px">{{switchLabel}}</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E63A8","options":["#1E63A8","#0F766E","#6D3FC0","#14212B"]},"startMode":{"editor":null},"startRole":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const p = props || {};
    this.state = { mode: p.startMode ?? 'login', role: p.startRole ?? 'customer' };
  }
  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#1E63A8';
    const login = s.mode === 'login';
    const admin = login && s.role === 'admin';
    const rider = login && s.role === 'rider';
    const roles = [{ id: 'customer', label: 'Customer' }, { id: 'rider', label: 'Rider' }, { id: 'admin', label: 'Admin' }].map((r) => ({
      ...r, bg: s.role === r.id ? '#fff' : 'transparent', color: s.role === r.id ? '#14212B' : '#4A5863',
      pick: () => this.setState({ role: r.id })
    }));
    return {
      accent, roles, isLogin: login, isSignup: !login, showGoogle: !admin && !rider,
      heading: !login ? 'Create your account' : (admin ? 'Admin sign in' : (rider ? 'Rider sign in' : 'Welcome back')),
      subheading: !login ? 'Book laundry in a few taps.' : (admin ? 'Manage orders, pricing and riders.' : (rider ? 'Accept bookings and deliver laundry.' : 'Sign in to book your next laundry.')),
      emailLabel: admin ? 'Staff email' : (rider ? 'Rider email or mobile' : 'Email'),
      emailPh: admin ? 'admin@laundryhub.ph' : 'you@email.com',
      primaryLabel: !login ? 'Create account' : 'Sign in',
      primaryHref: admin ? 'AdminDashboard.dc.html' : (rider ? 'Rider.dc.html' : 'Main.dc.html'),
      switchText: login ? 'New to Laundry HUB?' : 'Already have an account?',
      switchLabel: login ? 'Sign up' : 'Sign in',
      toggleMode: () => this.setState({ mode: login ? 'signup' : 'login', role: 'customer' })
    };
  }
}
</script>
</body>
</html>
