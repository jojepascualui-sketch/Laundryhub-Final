<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track order</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E63A8}a:hover{color:#123F6E}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F5F2; color: #14212B; font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden">
<header style="padding: 22px 22px 12px; display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D5DBD6; background: #fff; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14212B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="flex: 1">
<div style="font-size: 13px; color: #4A5863">Order #LH-0001</div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 21px">Track your laundry</div>
</div>
</header>

<div style="flex: 1; overflow-y: auto; padding: 6px 22px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="position: relative; height: 210px; border-radius: 22px; overflow: hidden; border: 2px solid #D5DBD6">
<svg width="100%" height="100%" viewBox="0 0 346 210" preserveAspectRatio="none" style="position: absolute; inset: 0" aria-hidden="true">
<rect width="346" height="210" fill="#E3EAE2"></rect>
<rect x="220" y="14" width="100" height="60" rx="10" fill="#CFE0C9"></rect>
<path d="M0 105 C 90 90, 200 130, 346 95" stroke="#fff" stroke-width="16" fill="none"></path>
<path d="M120 0 L 150 210" stroke="#fff" stroke-width="12" fill="none"></path>
<path d="M0 40 L 346 58" stroke="#fff" stroke-width="7" fill="none"></path>
<path d="M0 180 L 346 165" stroke="#fff" stroke-width="7" fill="none"></path>
<path d="M60 170 C 100 120, 140 110, 180 100 S 260 70, 280 60" stroke="#1E63A8" stroke-width="4" stroke-dasharray="8 6" fill="none"></path>
</svg>
<span style="position: absolute; left: 14%; top: 72%; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 17px; background: #14212B; border: 3px solid #fff; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V8l7-5 7 5v13"></path></svg>
</span>
<span style="position: absolute; left: 52%; top: 48%; transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 19px; background: {{accent}}; border: 3px solid #fff; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6h13v10H1zM14 10h4l3 3v3h-7"></path><circle cx="5.5" cy="18" r="2"></circle><circle cx="17.5" cy="18" r="2"></circle></svg>
</span>
<span style="position: absolute; left: 81%; top: 28%; transform: translate(-50%, -100%)">
<svg width="34" height="42" viewBox="0 0 40 48" aria-hidden="true"><path d="M20 47s16-15.6 16-27A16 16 0 0 0 4 20c0 11.4 16 27 16 27z" fill="#E0662A" stroke="#fff" stroke-width="2.5"></path><circle cx="20" cy="20" r="6" fill="#fff"></circle></svg>
</span>
<span style="position: absolute; left: 12px; bottom: 12px; background: #fff; border-radius: 12px; padding: 7px 11px; font-size: 12px; font-weight: 700">Rider is on the way · live GPS</span>
</div>

<div style="background: #fff; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 12px">
<span style="width: 48px; height: 48px; border-radius: 24px; background: #E4EEF8; color: {{accent}}; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">RM</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700; font-size: 15px">[RIDER NAME]</span>
<span style="font-size: 13px; color: #4A5863">Your rider · [PLATE NO.]</span>
</span>
<button aria-label="Call rider" style="width: 46px; height: 46px; border-radius: 23px; border: none; background: {{accent}}; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>
</button>
</div>

<div style="background: #fff; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 0">
<span style="font-weight: 700; font-size: 16px; margin-bottom: 14px">Order status</span>
<sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
<div style="display: flex; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center">
<span style="width: 24px; height: 24px; border-radius: 12px; background: {{st.dot}}; border: 2px solid {{st.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<sc-if value="{{st.done}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</span>
<sc-if value="{{st.hasLine}}" hint-placeholder-val="{{ true }}"><span style="width: 2px; flex: 1; min-height: 26px; background: {{st.line}}"></span></sc-if>
</div>
<div style="padding-bottom: 16px; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700; font-size: 14px; color: {{st.textColor}}">{{st.label}}</span>
<span style="font-size: 12px; color: #4A5863">{{st.note}}</span>
</div>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E63A8","options":["#1E63A8","#0F766E","#6D3FC0","#14212B"]},"currentStep":{"editor":"range","default":3,"min":0,"max":4,"step":1},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1E63A8';
    const cur = Number(this.props.currentStep ?? 3);
    const list = [
      { label: 'Order placed', note: 'We received your order' },
      { label: 'Picked up', note: 'Rider collected your laundry' },
      { label: 'Washing & drying', note: 'Your clothes are being cleaned' },
      { label: 'Out for delivery', note: 'Rider is heading to your pin' },
      { label: 'Delivered', note: 'Enjoy your fresh laundry' }
    ];
    const steps = list.map((x, i) => ({
      ...x,
      done: i < cur || (i === cur && cur === 4),
      dot: i < cur || (i === cur && cur === 4) ? accent : '#fff',
      ring: i <= cur ? accent : '#C8D0CA',
      line: i < cur ? accent : '#DCE2DD',
      hasLine: i < list.length - 1,
      textColor: i <= cur ? '#14212B' : '#6B7780'
    }));
    return { accent, steps };
  }
}
</script>
</body>
</html>
